# The reusable workflow the repositories call (see README.md and examples/chusai.yml). One job lists the pull requests
# to look at, then one job per pull request brings the default branch into it. It skips quietly when the credentials
# are missing, as they are for pull requests from forks.
name: Chusai

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/chusai.json
      model:
        type: string
        default: claude-opus-5-5
      dry-run:
        type: boolean
        default: false
      max-parallel:
        type: number
        default: 4
      # For repositories whose `npm ci` needs a private registry (GashoPlugins: https://npm.pkg.github.com, @4rtoflow).
      # The token is the job's own, so the caller grants `packages: read`.
      registry-url:
        type: string
        default: ""
      registry-scope:
        type: string
        default: ""
      # Workload Identity Federation (no Claude API key). These IDs are not secret; pass them from Actions variables.
      anthropic-federation-rule-id:
        type: string
        default: ""
      anthropic-organization-id:
        type: string
        default: ""
      anthropic-service-account-id:
        type: string
        default: ""
      anthropic-workspace-id:
        type: string
        default: ""
    secrets:
      anthropic-api-key:
        required: false
      app-id:
        required: false
      app-private-key:
        required: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.select.outputs.targets || '[]' }}
    steps:
      - id: secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic-api-key }}
          FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
          APP_ID: ${{ secrets.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ] && { [ -n "$FEDERATION_RULE_ID" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The credentials for Chusai are not available here (a pull request from a fork?); skipping."
          fi
      - id: token
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - id: select
        if: steps.secrets.outputs.ok == 'true'
        uses: 4rtofl/Chusai@main
        with:
          command: select
          github-token: ${{ steps.token.outputs.token }}
          config: ${{ inputs.config }}

  resolve:
    needs: select
    if: needs.select.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # npm ci and the verify commands run twice (on the merge and on the resolution), with Claude in between.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.targets) }}
    # A newer run for the same pull request (a push to it, or another push to the default branch) makes this one stale.
    concurrency:
      group: chusai-${{ github.repository }}-${{ matrix.pr }}
      cancel-in-progress: true
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      # Chusai checks out the pull request's branch itself; this only brings the history. Not the event's ref: GitHub
      # makes no refs/pull/<n>/merge for a pull request that conflicts. No credentials are left in the repository's
      # config for Claude or the pull request's code to read.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.token.outputs.token }}
      - uses: 4rtofl/Chusai@main
        with:
          command: resolve
          pr: ${{ matrix.pr }}
          github-token: ${{ steps.token.outputs.token }}
          app-slug: ${{ steps.token.outputs.app-slug }}
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          anthropic-federation-rule-id: ${{ inputs.anthropic-federation-rule-id }}
          anthropic-organization-id: ${{ inputs.anthropic-organization-id }}
          anthropic-service-account-id: ${{ inputs.anthropic-service-account-id }}
          anthropic-workspace-id: ${{ inputs.anthropic-workspace-id }}
          config: ${{ inputs.config }}
          model: ${{ inputs.model }}
          dry-run: ${{ inputs.dry-run }}
          registry-url: ${{ inputs.registry-url }}
          registry-scope: ${{ inputs.registry-scope }}
