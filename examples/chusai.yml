# Copy to .github/workflows/chusai.yml in the repository whose pull requests Chusai keeps up to date with main.
name: Chusai

on:
  # Every merge to main can make open pull requests conflict, or break them without a conflict.
  push:
    branches: [main]
  # A branch made from an old main may conflict as soon as it is opened or pushed to.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  id-token: write # Workload Identity Federation for the Claude API
  # packages: read # when `npm ci` needs GitHub Packages (see registry-url below)

jobs:
  chusai:
    uses: 4rtofl/Chusai/.github/workflows/resolve.yml@main
    with:
      # true: push and comment nothing; write what Chusai would do to the job summary.
      dry-run: true
      # registry-url: https://npm.pkg.github.com
      # registry-scope: "@4rtoflow"
      anthropic-federation-rule-id: ${{ vars.CHUSAI_ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      anthropic-workspace-id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    secrets:
      # Only without Workload Identity Federation; leave the secret unset otherwise.
      anthropic-api-key: ${{ secrets.CHUSAI_ANTHROPIC_API_KEY }}
      app-id: ${{ secrets.CHUSAI_APP_ID }}
      app-private-key: ${{ secrets.CHUSAI_APP_PRIVATE_KEY }}
